<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Flow | Dashboard</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <h1>Task Flow</h1>
      <button type="button" id="add-task-btn" class="btn btn-primary">+ Add Task</button>
    </div>
  </header>

  <main class="app-main">
    <section id="task-list" class="task-list" aria-live="polite"></section>
    <p id="empty-state" class="empty-state" hidden>
      No tasks yet. Click "+ Add Task" to create your first one.
    </p>
  </main>

  <!-- Add / Edit task modal -->
  <div id="task-modal" class="modal-overlay" hidden>
    <div class="modal-dialog" role="dialog" aria-modal="true" aria-labelledby="task-modal-title">
      <div class="modal-header">
        <h2 id="task-modal-title">Add Task</h2>
        <button type="button" id="task-modal-close-btn" class="btn-icon" aria-label="Close">&times;</button>
      </div>
      <form id="task-form" novalidate>
        <div class="form-field">
          <label for="task-title">Title</label>
          <input type="text" id="task-title" name="title" maxlength="100" />
          <span class="field-error" id="title-error"></span>
        </div>

        <div class="form-field">
          <label for="task-description">Description</label>
          <textarea id="task-description" name="description" rows="3" maxlength="500"></textarea>
          <span class="field-error" id="description-error"></span>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="task-priority">Priority</label>
            <select id="task-priority" name="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
            </select>
            <span class="field-error" id="priority-error"></span>
          </div>

          <div class="form-field">
            <label for="task-status">Status</label>
            <select id="task-status" name="status">
              <option value="To Do" selected>To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
            <span class="field-error" id="status-error"></span>
          </div>
        </div>

        <div class="form-row">
          <div class="form-field">
            <label for="task-category">Category</label>
            <input type="text" id="task-category" name="category" maxlength="40" />
            <span class="field-error" id="category-error"></span>
          </div>

          <div class="form-field">
            <label for="task-due-date">Due Date</label>
            <input type="date" id="task-due-date" name="dueDate" />
            <span class="field-error" id="dueDate-error"></span>
          </div>
        </div>

        <div class="modal-actions">
          <button type="button" id="task-cancel-btn" class="btn btn-secondary">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Task</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <script src="js/storage.js"></script>
  <script src="js/validation.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
